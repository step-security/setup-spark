name: Test setup-spark action
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:

  build-setup-spark:
    name: 📦 Lint and build setup-spark
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install dependencies
      run: npm ci

    - name: Run eslint checks
      run: npm run test

    - name: Build action
      run: npm run build

    - name: Check dist/index.js is up-to-date with src/setup-spark.ts
      run: git diff --exit-code dist


  test-setup-spark:
    name: ☑️ Run setup-spark
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.versions.os }}
    strategy:
      matrix:
        versions:
          - os: 'ubuntu-latest'
            spark: 3.5.3
            hadoop: 3
            java: 17
          - os: 'ubuntu-latest'
            spark: 3.4.4
            hadoop: 3
            java: 17
          - os: 'ubuntu-latest'
            spark: 3.3.2
            hadoop: 3
            java: 17
          - os: 'ubuntu-latest'
            spark: 3.0.2
            hadoop: 3.2
            java: 11
          - os: 'ubuntu-latest'
            spark: 3.1.2
            hadoop: 3.2
            java: 11
          - os: 'macos-latest'
            spark: 3.5.3
            hadoop: 3
            java: 17

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Java ${{ matrix.versions.java }}
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: ${{ matrix.versions.java }}
    - name: Install dependencies
      run: npm ci

    - name: Run setup-spark ${{ matrix.versions.spark }}
      uses: ./
      with:
        spark-version: ${{ matrix.versions.spark }}
        hadoop-version: ${{ matrix.versions.hadoop }}

    - name: Check Spark
      run: |
        spark-submit --version
        echo $SPARK_HOME



  test-setup-spark-scala:
    name: 🛢️ Run setup-spark with given Scala version
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        versions:
          - spark: 3.5.3
            hadoop: 3
            scala: 2.13
            java: 17
          - spark: 3.2.1
            hadoop: 3.2
            scala: 2.13
            java: 11

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Java ${{ matrix.versions.java }}
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: ${{ matrix.versions.java }}
    - name: Install dependencies
      run: npm ci

    - name: Run setup-spark ${{ matrix.versions.spark }}
      uses: ./
      with:
        spark-version: ${{ matrix.versions.spark }}
        hadoop-version: ${{ matrix.versions.hadoop }}
        scala-version: ${{ matrix.versions.scala }}


    - name: Check Spark
      run: spark-submit --version


  test-setup-spark-url:
    name: 🔗 Run setup-spark with given URL
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        versions:
          - spark: 3.4.1
            hadoop: 3
            java: 17
          - spark: 3.2.1
            hadoop: 3.2
            java: 11

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Java ${{ matrix.versions.java }}
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: ${{ matrix.versions.java }}
    - name: Install dependencies
      run: npm ci

    - name: Run setup-spark ${{ matrix.versions.spark }}
      uses: ./
      with:
        spark-version: ${{ matrix.versions.spark }}
        hadoop-version: ${{ matrix.versions.hadoop }}
        spark-url: 'https://archive.apache.org/dist/spark/spark-${{ matrix.versions.spark }}/spark-${{ matrix.versions.spark }}-bin-hadoop${{ matrix.versions.hadoop }}.tgz'

    - name: Check Spark
      run: spark-submit --version


  test-setup-spark-dependabot:
    name: ☑️ Run setup-spark (dependabot)
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Java 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: '17'
    - name: Install dependencies
      run: npm ci

    - name: Run setup-spark
      uses: ./
      with:
        spark-version: '3.5.3'
        hadoop-version: '3'

    - name: Check Spark
      run: |
        spark-submit --version
        echo $SPARK_HOME
